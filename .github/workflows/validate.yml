name: Validate package

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

env:
    PACKAGE_NAME: com.reefbarman.gamedb
    PACKAGE_REV: ${{ github.event.pull_request.head.sha || github.sha }}
    UNITY_VERSION: 6000.5.4f1

jobs:
    package-integrity:
        name: Package integrity
        runs-on: ubuntu-22.04
        timeout-minutes: 10
        concurrency:
            group: gamedb-static-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

        steps:
            - name: Check out source revision
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
                  ref: ${{ env.PACKAGE_REV }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Validate package contract
              shell: bash
              run: |
                  set -euo pipefail
                  python3 - <<'PY'
                  import json
                  import pathlib
                  import re
                  import subprocess
                  import urllib.parse

                  root = pathlib.Path('.')

                  def fail(message):
                      raise SystemExit(message)

                  def require(condition, message):
                      if not condition:
                          fail(message)

                  def load_json(path):
                      with (root / path).open(encoding='utf-8-sig') as handle:
                          return json.load(handle)

                  tracked = subprocess.run(
                      ['git', 'ls-files'],
                      check=True,
                      capture_output=True,
                      text=True,
                  ).stdout.splitlines()
                  generated = re.compile(
                      r'(^|/)(Library|Temp|Obj|Build|Builds|Logs|UserSettings|TestResults|CoverageResults)(/|$)|\.(csproj|sln)$',
                      re.IGNORECASE,
                  )
                  rejected = [path for path in tracked if generated.search(path)]
                  require(not rejected, 'Generated Unity/IDE files are tracked:\n' + '\n'.join(rejected))

                  json_paths = {
                      pathlib.Path('package.json'),
                      pathlib.Path('TestProject~/Packages/manifest.json'),
                      pathlib.Path('TestProject~/Packages/packages-lock.json'),
                      *pathlib.Path('Runtime').rglob('*.asmdef'),
                      *pathlib.Path('Editor').rglob('*.asmdef'),
                      *pathlib.Path('Tests').rglob('*.asmdef'),
                      *pathlib.Path('Samples~').rglob('*.json'),
                  }
                  for path in sorted(json_paths):
                      load_json(path)

                  package = load_json('package.json')
                  require(package.get('name') == 'com.reefbarman.gamedb', 'Unexpected package name')
                  require(
                      re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', package.get('version', '')),
                      'Invalid package version',
                  )
                  require(package.get('unity') == '6000.5', 'package.json unity must be 6000.5')
                  require(package.get('unityRelease') == '4f1', 'package.json unityRelease must be 4f1')
                  require(package.get('dependencies') == {
                      'com.unity.modules.imgui': '1.0.0',
                      'com.unity.modules.unitywebrequest': '1.0.0',
                      'com.unity.nuget.newtonsoft-json': '3.2.2',
                  }, 'Unexpected package dependency contract')

                  required_paths = [
                      'README.md',
                      'CHANGELOG.md',
                      'LICENSE.md',
                      'Third Party Notices.md',
                      'Documentation~/index.md',
                      'Documentation~/editor-authoring.md',
                      'Documentation~/runtime.md',
                      'Documentation~/api-reference.md',
                      'Documentation~/automation.md',
                      'Documentation~/google-sheets.md',
                      'Samples~/Basic/README.md',
                      'Samples~/Basic/Resources/GameDBs/basic.json',
                      'Samples~/Basic/Resources/GameDBs/basic.schema.json',
                  ]
                  for sample in package.get('samples', []):
                      required_paths.append(sample['path'])
                  for path in required_paths:
                      require((root / path).exists(), f'Missing package file: {path}')

                  manifest = load_json('TestProject~/Packages/manifest.json')
                  require(
                      manifest['dependencies'].get('com.reefbarman.gamedb') == 'file:../..',
                      'Development project must use file:../.. before CI preparation',
                  )
                  require(
                      'com.reefbarman.gamedb' in manifest.get('testables', []),
                      'Package must remain testable',
                  )

                  project_version = (root / 'TestProject~/ProjectSettings/ProjectVersion.txt').read_text(encoding='utf-8-sig')
                  require('m_EditorVersion: 6000.5.4f1' in project_version, 'Unexpected TestProject Unity version')

                  tests = load_json('Tests/EditMode/GameDBLibrary.Tests.asmdef')
                  require(tests.get('name') == 'GameDBLibrary.Tests', 'Unexpected test assembly name')
                  require(tests.get('includePlatforms') == ['Editor'], 'Tests must be EditMode-only')
                  require('UNITY_INCLUDE_TESTS' in tests.get('defineConstraints', []), 'Missing UNITY_INCLUDE_TESTS constraint')

                  for tree_name in ('Runtime', 'Editor', 'Tests'):
                      tree = root / tree_name
                      for path in (tree, *tree.rglob('*')):
                          if path.name.endswith('.meta'):
                              target = pathlib.Path(str(path)[:-5])
                              require(target.exists(), f'Orphan metadata file: {path}')
                          else:
                              meta = pathlib.Path(str(path) + '.meta')
                              require(meta.is_file(), f'Missing metadata file: {meta}')

                  markdown_paths = [
                      root / 'README.md',
                      root / 'CHANGELOG.md',
                      *(root / 'Documentation~').glob('*.md'),
                      *(root / 'Samples~').rglob('*.md'),
                  ]
                  link_pattern = re.compile(r'\[[^\]]*\]\(([^)]+)\)')
                  for markdown in markdown_paths:
                      text = markdown.read_text(encoding='utf-8-sig')
                      for target in link_pattern.findall(text):
                          if target.startswith(('http://', 'https://', 'mailto:', '#')):
                              continue
                          relative = urllib.parse.unquote(target.split('#', 1)[0])
                          if not relative:
                              continue
                          resolved = (markdown.parent / relative).resolve()
                          require(resolved.exists(), f'Broken Markdown link in {markdown}: {target}')

                  print('Static UPM package integrity checks passed.')
                  PY

            - name: Validate repository whitespace
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
              run: |
                  set -euo pipefail
                  base_sha="$BASE_SHA"

                  if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$base_sha" ]]; then
                    base_sha="$(git merge-base "$base_sha" HEAD)"
                  elif [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
                    if git rev-parse HEAD^ >/dev/null 2>&1; then
                      base_sha="$(git rev-parse HEAD^)"
                    else
                      base_sha="$(git hash-object -t tree /dev/null)"
                    fi
                  fi

                  git diff --check "$base_sha" HEAD

    unity-editmode-clean-install:
        name: Unity Git install and EditMode tests
        needs: package-integrity
        if: >-
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-22.04
        timeout-minutes: 90
        environment: unity-ci
        concurrency:
            group: gamedb-unity-license-${{ github.repository }}
            cancel-in-progress: false

        steps:
            - name: Check out source revision
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  ref: ${{ env.PACKAGE_REV }}
                  persist-credentials: false

            - name: Prepare clean Git URL consumer project
              shell: bash
              run: |
                  set -euo pipefail
                  package_url="https://github.com/${GITHUB_REPOSITORY}.git#${PACKAGE_REV}"
                  jq --arg name "$PACKAGE_NAME" --arg url "$package_url" \
                    '.dependencies[$name] = $url' \
                    TestProject~/Packages/manifest.json \
                    > TestProject~/Packages/manifest.json.tmp
                  mv TestProject~/Packages/manifest.json.tmp TestProject~/Packages/manifest.json
                  rm -f TestProject~/Packages/packages-lock.json
                  rm -rf TestProject~/Library TestProject~/Logs
                  jq -e --arg name "$PACKAGE_NAME" --arg url "$package_url" \
                    '.dependencies[$name] == $url and (.testables | index($name) != null)' \
                    TestProject~/Packages/manifest.json

            - name: Resolve, compile, and run EditMode tests
              uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
              env:
                  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
                  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
                  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
              with:
                  projectPath: TestProject~
                  unityVersion: 6000.5.4f1
                  customImage: unityci/editor:ubuntu-6000.5.4f1-base-3
                  testMode: editmode
                  artifactsPath: artifacts
                  customParameters: -assemblyNames GameDBLibrary.Tests

            - name: Verify Git resolution and test results
              if: always()
              shell: bash
              run: |
                  set -euo pipefail
                  jq -e --arg name "$PACKAGE_NAME" \
                    '.dependencies[$name].source == "git"' \
                    TestProject~/Packages/packages-lock.json
                  python3 - <<'PY'
                  import pathlib
                  import xml.etree.ElementTree as ET

                  results = []
                  for path in pathlib.Path('artifacts').rglob('*.xml'):
                      try:
                          root = ET.parse(path).getroot()
                      except ET.ParseError:
                          continue
                      for attribute in ('testcasecount', 'total'):
                          value = root.attrib.get(attribute)
                          if value and value.isdigit():
                              results.append(int(value))

                  if not results or max(results) <= 0:
                      raise SystemExit('Unity produced no non-empty XML test result')
                  print(f'Unity reported at least {max(results)} executed tests.')
                  PY

            - name: Upload Unity results and logs
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: unity-editmode-${{ env.UNITY_VERSION }}
                  path: |
                      artifacts
                      TestProject~/Logs
                  if-no-files-found: warn
                  retention-days: 14
